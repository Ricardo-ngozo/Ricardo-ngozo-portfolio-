<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ricardo character studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#16171b;color:#f3f0e9;font:15px system-ui}main{display:grid;grid-template-columns:minmax(0,1fr) 290px;max-width:1100px;margin:auto;min-height:100vh}.stage{height:100vh;min-height:600px;position:relative;background:radial-gradient(ellipse at 50% 40%,#33363f,#16171b 65%)}canvas{width:100%;height:100%;display:block}aside{padding:40px 24px;align-self:center}button,select{font:inherit;padding:10px;margin:4px;border:1px solid #666;border-radius:8px;background:#25262c;color:inherit}label{display:block;margin-top:18px}input{width:100%}p{color:#aaa;line-height:1.7}@media(max-width:600px){main{display:block}.stage{height:75vh;min-height:480px}}
</style></head><body><main><div id="stage" class="stage"></div><aside><h1>Ricardo / v2</h1><p>Procedural character study. Real skinning and facial shape controls.</p><select aria-label="Expression" id="mood"><option>neutral</option><option>happy</option><option>curious</option><option>surprised</option><option>annoyed</option></select><button id="wave">Wave</button><button id="portrait">Portrait</button><button id="calm">Pause motion</button><label>Turn character<input id="yaw" type="range" min="-180" max="180" value="-8"></label><p id="status" role="status">Loading character…</p><p><a href="./index.html" style="color:inherit">Return to portfolio</a></p></aside></main><script type="module">
import {createCharacter} from "./assets/character/viewer.js";
const abort=new AbortController();const host=document.querySelector("#stage");
try{const a=await createCharacter(host,{assetURL:new URL("./assets/character/ricardo-v2.glb",location.href).href,signal:abort.signal,onState:s=>{document.querySelector("#status").textContent=s.status||s.emotion||"Ready";}});window.character=a;
document.querySelector("#mood").onchange=e=>a.setEmotion(e.target.value,Infinity);document.querySelector("#wave").onclick=()=>a.wave();let portrait=false,calm=false;
document.querySelector("#portrait").onclick=()=>a.setPortrait(portrait=!portrait);document.querySelector("#calm").onclick=()=>a.setCalm(calm=!calm);document.querySelector("#yaw").oninput=e=>a.setYaw(Number(e.target.value)*Math.PI/180);
host.onpointermove=e=>{const r=host.getBoundingClientRect();a.lookAt((e.clientX-r.left)/r.width*2-1,1-(e.clientY-r.top)/r.height*2);};
window.addEventListener("pagehide",()=>abort.abort(),{once:true});
}catch(e){document.querySelector("#status").textContent="WebGL preview unavailable: "+e.message;}
</script></body></html>
