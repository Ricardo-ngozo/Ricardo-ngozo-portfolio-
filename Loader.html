<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Loading screen for Samukelo Ricardo Ngozo's portfolio — click anywhere to enter." />
    <title>Loading… | Ricardo Ngozo</title>
    <link rel="icon" type="image/png" href="./assets/images/ChatGPT Image May 14, 2026, 10_57_41 AM.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-base: #070a13;
        --nav-glass: rgba(15, 20, 35, 0.65);
        --border-glass: rgba(255, 255, 255, 0.08);
        --text-primary: #ffffff;
        --text-secondary: #94a3b8;
        --accent-cyan: #38bdf8;
        --accent-purple: #818cf8;
        --font-main: "Plus Jakarta Sans", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--bg-base);
        color: var(--text-primary);
        font-family: var(--font-main);
        overflow: hidden;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .loader-wrap {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      canvas#pong {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      .overlay {
        position: relative;
        z-index: 2;
        text-align: center;
        padding: 32px 40px;
        border-radius: 24px;
        background: var(--nav-glass);
        border: 1px solid var(--border-glass);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        animation: floatPulse 3.2s ease-in-out infinite;
        pointer-events: none;
      }

      .overlay .brand {
        font-size: 0.85rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent-cyan);
        margin: 0 0 10px;
        font-weight: 600;
      }

      .overlay h1 {
        margin: 0 0 8px;
        font-size: clamp(1.6rem, 4vw, 2.4rem);
        font-weight: 700;
        background: linear-gradient(135deg, #ffffff 0%, var(--accent-cyan) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .overlay p {
        margin: 0;
        color: var(--text-secondary);
        font-size: 0.95rem;
      }

      .overlay .prompt {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 18px;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-primary);
        opacity: 0.85;
      }

      .prompt .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent-purple);
        animation: blink 1.4s ease-in-out infinite;
      }

      .prompt .dot:nth-child(2) {
        animation-delay: 0.2s;
      }
      .prompt .dot:nth-child(3) {
        animation-delay: 0.4s;
      }

      .score {
        position: absolute;
        top: 32px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 48px;
        font-size: 1.4rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        color: var(--text-secondary);
        z-index: 2;
        pointer-events: none;
      }

      .score span {
        color: var(--text-primary);
      }

      @keyframes floatPulse {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 0.2;
        }
        50% {
          opacity: 1;
        }
      }

      .fade-out {
        animation: fadeOut 0.5s ease forwards;
      }

      @keyframes fadeOut {
        to {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="loader-wrap" id="loaderWrap">
      <div class="score" aria-hidden="true">
        <div>P1 <span id="scoreLeft">0</span></div>
        <div>P2 <span id="scoreRight">0</span></div>
      </div>
      <canvas id="pong"></canvas>
      <div class="overlay">
        <p class="brand">Ricardo.</p>
        <h1>Loading the portfolio…</h1>
        <p>Enjoy a quick rally while things warm up.</p>
        <div class="prompt">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          Click anywhere to enter
        </div>
      </div>
    </div>

    <script>
      const canvas = document.getElementById("pong");
      const ctx = canvas.getContext("2d");
      const scoreLeftEl = document.getElementById("scoreLeft");
      const scoreRightEl = document.getElementById("scoreRight");

      let width, height;
      const paddleWidth = 12;
      const paddleHeight = 90;
      const ballSize = 9;

      let leftY, rightY, ballX, ballY, ballSpeedX, ballSpeedY;
      let scoreLeft = 0;
      let scoreRight = 0;
      let running = true;
      let rafId = null;

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }

      function resetBall(direction) {
        ballX = width / 2;
        ballY = height / 2;
        const speed = Math.max(3.5, width * 0.0035);
        ballSpeedX = speed * direction;
        ballSpeedY = (Math.random() * 2 - 1) * speed;
      }

      function init() {
        resize();
        leftY = height / 2 - paddleHeight / 2;
        rightY = height / 2 - paddleHeight / 2;
        resetBall(Math.random() > 0.5 ? 1 : -1);
      }

      function drawNet() {
        ctx.strokeStyle = "rgba(255,255,255,0.08)";
        ctx.lineWidth = 2;
        ctx.setLineDash([10, 14]);
        ctx.beginPath();
        ctx.moveTo(width / 2, 0);
        ctx.lineTo(width / 2, height);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      function drawPaddle(x, y) {
        const grad = ctx.createLinearGradient(x, y, x, y + paddleHeight);
        grad.addColorStop(0, "#38bdf8");
        grad.addColorStop(1, "#818cf8");
        ctx.fillStyle = grad;
        ctx.shadowColor = "rgba(56,189,248,0.6)";
        ctx.shadowBlur = 14;
        ctx.fillRect(x, y, paddleWidth, paddleHeight);
        ctx.shadowBlur = 0;
      }

      function drawBall() {
        ctx.beginPath();
        ctx.fillStyle = "#ffffff";
        ctx.shadowColor = "rgba(255,255,255,0.8)";
        ctx.shadowBlur = 16;
        ctx.arc(ballX, ballY, ballSize / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      function update() {
        // simple AI tracking with slight lag for a natural feel
        const leftTarget = ballY - paddleHeight / 2;
        const rightTarget = ballY - paddleHeight / 2;
        leftY += (leftTarget - leftY) * 0.09;
        rightY += (rightTarget - rightY) * 0.07;

        leftY = Math.max(0, Math.min(height - paddleHeight, leftY));
        rightY = Math.max(0, Math.min(height - paddleHeight, rightY));

        ballX += ballSpeedX;
        ballY += ballSpeedY;

        if (ballY <= ballSize / 2 || ballY >= height - ballSize / 2) {
          ballSpeedY *= -1;
        }

        // left paddle collision
        if (
          ballX - ballSize / 2 <= paddleWidth + 24 &&
          ballY >= leftY &&
          ballY <= leftY + paddleHeight &&
          ballSpeedX < 0
        ) {
          ballSpeedX *= -1.05;
          ballSpeedY += (Math.random() - 0.5) * 2;
        }

        // right paddle collision
        if (
          ballX + ballSize / 2 >= width - paddleWidth - 24 &&
          ballY >= rightY &&
          ballY <= rightY + paddleHeight &&
          ballSpeedX > 0
        ) {
          ballSpeedX *= -1.05;
          ballSpeedY += (Math.random() - 0.5) * 2;
        }

        if (ballX < 0) {
          scoreRight++;
          scoreRightEl.textContent = scoreRight;
          resetBall(1);
        } else if (ballX > width) {
          scoreLeft++;
          scoreLeftEl.textContent = scoreLeft;
          resetBall(-1);
        }
      }

      function render() {
        ctx.clearRect(0, 0, width, height);
        drawNet();
        drawPaddle(24, leftY);
        drawPaddle(width - paddleWidth - 24, rightY);
        drawBall();
      }

      function loop() {
        if (!running) return;
        update();
        render();
        rafId = requestAnimationFrame(loop);
      }

      window.addEventListener("resize", () => {
        const wasRunning = running;
        resize();
        if (wasRunning) {
          leftY = Math.min(leftY, height - paddleHeight);
          rightY = Math.min(rightY, height - paddleHeight);
        }
      });

      init();
      loop();

      document.body.addEventListener("click", () => {
        running = false;
        if (rafId) cancelAnimationFrame(rafId);
        document.getElementById("loaderWrap").classList.add("fade-out");
        setTimeout(() => {
          window.location.href = "./index.html";
        }, 400);
      });
    </script>
  </body>
</html>
