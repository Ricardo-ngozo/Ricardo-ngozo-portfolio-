    <style>
      :root {
        --bg-base: #101522;
        --nav-glass: rgba(21,28,44, 0.65);
        --border-glass: rgba(255, 255, 255, 0.08);
        --text-primary: #f6efe3;
        --text-secondary: #b9bfce;
        --accent-cyan: #c5b5ee;
        --accent-purple: #c5b5ee;
        --font-main: "Space Grotesk", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--bg-base);
        color: var(--text-primary);
        font-family: var(--font-main);
        overflow: hidden;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .loader-wrap {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      canvas#pong {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      .overlay {
        position: relative;
        z-index: 2;
        text-align: center;
        padding: 32px 40px;
        border-radius: 24px;
        background: var(--nav-glass);
        border: 1px solid var(--border-glass);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        animation: floatPulse 3.2s ease-in-out infinite;
        pointer-events: none;
      }

      .overlay .brand {
        font-size: 0.85rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent-cyan);
        margin: 0 0 10px;
        font-weight: 600;
      }

      .overlay h1 {
        margin: 0 0 8px;
        font-size: clamp(1.6rem, 4vw, 2.4rem);
        font-weight: 700;
        background: linear-gradient(135deg, #f6efe3 0%, var(--accent-cyan) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .overlay p {
        margin: 0;
        color: var(--text-secondary);
        font-size: 0.95rem;
      }

      .overlay .prompt {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 18px;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-primary);
        opacity: 0.85;
      }

      .prompt .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent-purple);
        animation: blink 1.4s ease-in-out infinite;
      }

      .prompt .dot:nth-child(2) {
        animation-delay: 0.2s;
      }
      .prompt .dot:nth-child(3) {
        animation-delay: 0.4s;
      }

      .score {
        position: absolute;
        top: 32px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 48px;
        font-size: 1.4rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        color: var(--text-secondary);
        z-index: 2;
        pointer-events: none;
      }

      .score span {
        color: var(--text-primary);
      }

      @keyframes floatPulse {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 0.2;
        }
        50% {
          opacity: 1;
        }
      }

      .fade-out {
        animation: fadeOut 0.5s ease forwards;
      }

      @keyframes fadeOut {
        to {
          opacity: 0;
        }
      }
    </style>
